<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#cb1a41">
    <title>Bonds is offline</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/offline.css">
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">B</div>
      <p class="eyebrow">Private by design</p>
      <h1>Your people are safe.<br>The connection is not.</h1>
      <p class="message">
        Bonds cannot reach its local server right now. Your relationship data remains
        on that server and is never copied into the offline cache.
      </p>
      <a class="retry" href="/">Try Bonds again</a>
      <p class="hint">Check that the Bonds service and your network or tunnel are running.</p>
    </main>
  </body>
</html>
