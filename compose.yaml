name: bonds

services:
  bonds:
    build:
      context: .
      target: runner
    image: bonds-crm:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${BONDS_PORT:-3100}:3100"
    environment:
      CRM_PASSWORD: "${CRM_PASSWORD:?Set CRM_PASSWORD in .env}"
      CRM_SESSION_SECRET: "${CRM_SESSION_SECRET:?Set CRM_SESSION_SECRET in .env}"
      CRM_SESSION_TTL_HOURS: "${CRM_SESSION_TTL_HOURS:-168}"
      CRM_API_TOKEN: "${CRM_API_TOKEN:-}"
      CRM_BACKUP_RETENTION_COUNT: "${CRM_BACKUP_RETENTION_COUNT:-20}"
      CRM_AUTOMATIC_BACKUP_INTERVAL_HOURS: "${CRM_AUTOMATIC_BACKUP_INTERVAL_HOURS:-24}"
      CRM_MAX_RESTORE_MB: "${CRM_MAX_RESTORE_MB:-256}"
      CRM_MAX_CONTACT_IMPORT_MB: "${CRM_MAX_CONTACT_IMPORT_MB:-10}"
      CORS_ALLOWED_EXTENSION_IDS: "${CORS_ALLOWED_EXTENSION_IDS:-}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      CRM_TRUST_PROXY_HEADERS: "${CRM_TRUST_PROXY_HEADERS:-false}"
      CRM_LOG_LEVEL: "${CRM_LOG_LEVEL:-info}"
    volumes:
      - bonds-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  bonds-data:
