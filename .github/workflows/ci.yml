name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CRM_PASSWORD: ci-password-for-build-only
      CRM_SESSION_SECRET: ci-session-secret-for-build-only-123456789
      CRM_DATABASE_PATH: /tmp/bonds-ci/relationships.db
      CRM_BACKUP_DIRECTORY: /tmp/bonds-ci/backups
      SEED_DEMO_DATA: "false"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:cloud
      - run: npm run lint
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm run test:production
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci
      - name: Audit mobile dependencies
        working-directory: apps/mobile
        run: npm audit --audit-level=moderate
      - name: Validate iOS source and bundle
        working-directory: apps/mobile
        run: npm run validate
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run browser journeys
        run: npx playwright test
      - name: Upload browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Validate Compose configuration
        run: CRM_PASSWORD=ci-container-password CRM_SESSION_SECRET=ci-container-session-secret-123456789 docker compose config --quiet
      - name: Build and smoke-test container image
        run: |
          docker build --tag bonds-crm:ci .
          container_id=$(docker run --detach \
            --publish 127.0.0.1:3110:3100 \
            --env CRM_PASSWORD=ci-container-password \
            --env CRM_SESSION_SECRET=ci-container-session-secret-123456789 \
            bonds-crm:ci)
          trap 'docker rm --force "$container_id"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3110/api/health/ready; then
              docker exec "$container_id" sh -c '
                test "$(stat -c %a /data)" = 700
                test "$(stat -c %a /data/backups)" = 700
                for file in /data/relationships.db* /data/backups/*; do
                  test -e "$file" || continue
                  test "$(stat -c %a "$file")" = 600
                done
              '
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1

  cloud-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:cloud
      - name: Install Chromium for cloud journeys
        run: npx playwright install --with-deps chromium
      - name: Run cloud browser journeys
        env:
          BONDS_E2E_CLOUD_UI: "true"
        run: >-
          npx playwright test
          tests/e2e/cloud-automatic-backup.spec.ts
          tests/e2e/cloud-duplicates.spec.ts
          tests/e2e/cloud-export.spec.ts
          tests/e2e/cloud-import.spec.ts
      - name: Upload cloud browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-cloud-report
          path: playwright-report/
          retention-days: 14
