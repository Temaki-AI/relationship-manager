name: iOS startup

on:
  pull_request:
    paths:
      - '.github/workflows/ios-startup.yml'
      - 'apps/mobile/scripts/verify-ios-startup.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  startup:
    runs-on: macos-26
    timeout-minutes: 22
    env:
      CI: '1'
      EXPO_PUBLIC_EVERCLOSE_API_URL: https://everclosecrm.com
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download verified native simulator build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37260071983 --repo Temaki-AI/relationship-manager --name Everclose-simulator --dir build/native-artifact
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          artifact = Path('build/native-artifact')
          assert (artifact / 'COMMIT.txt').read_text().strip() == 'd5d2763086a350751f484f57c7a8738ca98693e8'
          assert hashlib.sha256((artifact / 'Everclose-simulator.zip').read_bytes()).hexdigest() == (artifact / 'SHA256.txt').read_text().split()[0]
          PY
          mkdir -p build/DerivedData/Build/Products/Release-iphonesimulator
          ditto -x -k build/native-artifact/Everclose-simulator.zip build/DerivedData/Build/Products/Release-iphonesimulator
      - name: Prepare isolated simulator
        timeout-minutes: 3
        run: python3 scripts/verify-ios-startup.py prepare >> "$GITHUB_ENV"
      - name: Check native compatibility and test the original compiled program
        run: |
          git diff --quiet 039c12b0044227de6c92511e5f335d977e2c2ce7 -- package.json package-lock.json app.json modules assets metro.config.cjs
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          app = Path('build/DerivedData/Build/Products/Release-iphonesimulator/Everclose.app')
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          assert info['CFBundleIdentifier'] == 'com.fernandoamaral.bonds'
          assert info['DTPlatformName'] == 'iphonesimulator'
          assert info['CFBundleVersion'] == '2'
          PY
      - name: Verify native startup and empty account storage
        timeout-minutes: 17
        run: python3 scripts/verify-ios-startup.py verify
      - name: Preserve startup evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Everclose-startup-evidence
          path: apps/mobile/build/artifact/
          if-no-files-found: warn
          retention-days: 14
